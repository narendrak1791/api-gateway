spring.application.name=api-gateway
server.port=9191

eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=*


#spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
#spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
#logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG

##Routes for employee service
spring.cloud.gateway.server.webmvc.routes[0].id=EMPLOYEE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/employee/**

#Routes for employee service
spring.cloud.gateway.server.webmvc.routes[1].id=DEPARTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/department/**